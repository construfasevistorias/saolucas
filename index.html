<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Vistoria de Entrega · Construfase</title>
<link rel="icon" href="img/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1012; --bg-2:#121417; --card:#181b1f; --card-2:#1f2328; --card-3:#262b31;
  --line:#2b3037; --line-2:#363c44;
  --ink:#f3f1ec; --ink-2:#d6d3cc; --muted:#9aa0a8; --dim:#6d737b;
  --orange:#f07d1a; --orange-2:#ff9638; --orange-dark:#c9620a; --orange-soft:rgba(240,125,26,.14);
  --green:#3ccf82; --green-soft:rgba(60,207,130,.13); --red:#ff5d52; --red-soft:rgba(255,93,82,.14);
  --blue:#59a8ff; --blue-soft:rgba(89,168,255,.14); --yellow:#f7c04a; --yellow-soft:rgba(247,192,74,.14);
  --radius:16px; --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 500px at 50% -200px,rgba(240,125,26,.10),transparent 70%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
svg.i.lg{width:26px;height:26px} svg.i.sm{width:16px;height:16px;vertical-align:-3px}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(14,16,18,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top .logo{height:28px;filter:brightness(0) invert(1);opacity:.95}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.top .me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:600;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.rede{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;padding:8px 14px;text-align:center;border-bottom:1px solid var(--line);cursor:pointer}
.rede.off{background:var(--yellow-soft);color:var(--yellow)}
.rede.env{background:var(--blue-soft);color:var(--blue)}
.rede.erro{background:var(--red-soft);color:var(--red)}
.rede.ok{background:var(--green-soft);color:var(--green)}
.tag.fila{background:var(--yellow-soft);color:var(--yellow)}
.demo-bar{background:var(--yellow-soft);color:var(--yellow);font-size:12.5px;padding:7px 14px;text-align:center;border-bottom:1px solid rgba(247,192,74,.25)}

/* ---------- layout ---------- */
main{max-width:1040px;margin:0 auto;padding:18px 14px calc(120px + var(--safe-b))}
h1{font-size:26px;margin:4px 0 4px;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;margin:26px 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.grid.g4{grid-template-columns:1fr 1fr}
@media(min-width:760px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--orange-2)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);border-radius:14px;padding:12px 18px;font-weight:650;font-size:15.5px;cursor:pointer;text-decoration:none;min-height:52px;transition:transform .08s,background .15s}
.btn:hover{background:var(--card-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 6px 20px rgba(240,125,26,.28)}
.btn.primary:hover{background:var(--orange-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#111}
.btn.green{background:var(--green);border-color:var(--green);color:#06210f}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--red);border-color:rgba(255,93,82,.35);background:var(--red-soft)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);border-radius:999px;padding:10px 15px;font-size:14.5px;font-weight:550;cursor:pointer;user-select:none;line-height:1.1;min-height:44px}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.chip .n{display:inline-block;min-width:20px;padding:2px 6px;border-radius:999px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;text-align:center}
.chip.on .n{background:#fff;color:var(--orange-dark)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:650;white-space:nowrap}
.tag.pendente,.tag.aberta{background:var(--card-3);color:var(--ink-2)}
.tag.em_vistoria{background:var(--blue-soft);color:var(--blue)}
.tag.concluida,.tag.resolvida,.tag.resolvida_na_hora{background:var(--green-soft);color:var(--green)}
.tag.equipe_acionada{background:var(--orange-soft);color:var(--orange-2)}
.tag.alta{background:var(--red-soft);color:var(--red)}
.tag.media{background:var(--yellow-soft);color:var(--yellow)}
.tag.baixa{background:var(--card-3);color:var(--muted)}

/* grade de opções grandes (cômodo / área) */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:74px;padding:10px 6px;border-radius:14px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.15}
.opt svg.i{width:24px;height:24px;color:var(--orange-2)}
.opt.on{background:var(--orange);border-color:var(--orange);color:#fff}
.opt.on svg.i{color:#fff}
.opts.rooms .opt{min-height:52px}
.opts.two{grid-template-columns:1fr 1fr;margin-bottom:12px}

/* ---------- formulários ---------- */
label.f{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:20px 0 9px;color:var(--muted)}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);border-radius:14px;padding:14px 15px;font-size:16px;outline:none}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
textarea.inp{min-height:100px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.search{position:relative}
.search svg.i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search .inp{padding-left:46px}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.unit{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-decoration:none;color:var(--ink);width:100%;text-align:left;min-height:68px}
.unit:active{background:var(--card-2)}
.unit .num{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;min-width:56px;height:46px;border-radius:12px;background:var(--card-3);letter-spacing:-.02em}
.unit .num.on{background:var(--orange-soft);color:var(--orange-2)}
.unit .who{flex:1;min-width:0}
.unit .who b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .who small{color:var(--muted);font-size:13px}
.bloco-ttl{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.bloco-ttl::after{content:"";flex:1;height:1px;background:var(--line)}
.hora{color:var(--orange-2)}

.occ{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px}
.occ.new{animation:flash 2.6s ease}
@keyframes flash{0%{background:var(--orange-soft);border-color:var(--orange)}100%{background:var(--card)}}
.occ .thumbs{display:flex;flex-direction:column;gap:6px}
.occ .thumb{width:82px;height:82px;border-radius:12px;object-fit:cover;background:var(--card-3);cursor:zoom-in}
.occ .body{flex:1;min-width:0}
.occ .meta{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.occ .meta b{color:var(--ink)}
.occ .desc{font-weight:650;font-size:16px;margin:2px 0 8px;word-wrap:break-word}
.occ .sug{display:flex;gap:8px;font-size:13.5px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;color:var(--ink-2)}
.occ .sug svg.i{color:var(--orange-2);margin-top:1px}
.occ .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- KPIs e painel ---------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.05;letter-spacing:-.03em}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.accent{border-color:rgba(240,125,26,.5);background:linear-gradient(160deg,var(--orange-soft),var(--card) 70%)}
.kpi.accent b{color:var(--orange-2)}
.bar{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:8px 0}
.bar .lbl{width:160px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .trk{flex:1;height:10px;background:var(--card-3);border-radius:99px;overflow:hidden}
.bar .fil{height:100%;background:linear-gradient(90deg,var(--orange-dark),var(--orange-2));border-radius:99px;display:block}
.bar .v{width:28px;text-align:right;font-weight:700}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p)*1%),var(--card-3) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:20px;letter-spacing:-.02em}.ring small{font-size:11px;color:var(--muted)}

/* mapa dos blocos */
.mapa{display:grid;gap:12px}
@media(min-width:760px){.mapa{grid-template-columns:1fr 1fr}}
.bloco{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.bloco h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;color:var(--ink)}
.andar{display:grid;grid-template-columns:22px repeat(10,1fr);gap:4px;margin-bottom:4px;align-items:center}
.andar .lv{font-size:11px;color:var(--dim);text-align:right;padding-right:2px}
.cel{position:relative;height:clamp(28px,5.4vw,46px);border-radius:7px;background:var(--card-3);border:1px solid transparent;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--muted);text-decoration:none;min-height:26px}
.cel.agendada{border-color:var(--orange);color:var(--ink)}
.cel.em_vistoria{background:var(--blue);color:#061a33;animation:pulse 1.6s infinite}
.cel.entregue{background:var(--green);color:#06210f}
.cel.retida{background:var(--orange);color:#fff}
.cel .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* ---------- barras inferiores ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(14,16,18,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b))}
.bottom .in{max-width:1040px;margin:0 auto;display:flex;gap:10px}
.bottom .btn{flex:1}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(14,16,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--dim);text-decoration:none}
.nav a svg.i{width:23px;height:23px}
.nav a.on{color:var(--orange-2)}

/* ---------- folha (modal) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg-2);border:1px solid var(--line);border-bottom:0;width:100%;max-width:740px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(96px + var(--safe-b));position:relative;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line);max-height:90vh}}
.sheet .hd{display:flex;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--bg-2);padding:14px 0 10px;z-index:2}
.sheet .hd::before{content:"";position:absolute;top:4px;left:50%;width:40px;height:4px;border-radius:9px;background:var(--line-2);transform:translateX(-50%)}
.sheet .hd h3{flex:1;margin:0;font-size:20px;letter-spacing:-.01em}
.sheet .x{border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:999px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet .ft{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + var(--safe-b));background:rgba(18,20,23,.96);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:41}
.sheet .ft .in{width:100%;max-width:708px;display:flex;gap:10px}
.sheet .ft .btn{flex:1}

.photos{display:flex;flex-wrap:wrap;gap:10px}
.photos .ph{position:relative}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:14px;display:block}
.photos .rm{position:absolute;top:-7px;right:-7px;width:28px;height:28px;border-radius:999px;border:2px solid var(--bg-2);background:var(--ink);color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.photos .rm svg.i{width:14px;height:14px}
.photos video{width:92px;height:92px;object-fit:cover;border-radius:14px;display:block;background:#000}
.photos .play,.vthumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;pointer-events:none}
.photos .desenhar{position:absolute;left:4px;right:4px;bottom:4px;border:0;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;font-weight:700;padding:4px 0;cursor:pointer}
.vthumb{position:relative;display:block}
.occ video.thumb{background:#000}
.zoom video{max-width:96vw;max-height:88vh;border-radius:10px}
.editor{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
.ed-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px;background:#111;border-bottom:1px solid #222}
.ed-grp{display:flex;gap:6px;align-items:center}
.ed-cor{width:30px;height:30px;border-radius:999px;border:3px solid #333;cursor:pointer}
.ed-cor.on{border-color:#fff}
.ed-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.ed-area canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:6px}
.ed-dica{text-align:center;color:#aaa;font-size:12.5px;padding:8px}
.addph{width:92px;height:92px;border:2px dashed var(--line-2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--card)}
.addph svg.i{width:28px;height:28px;color:var(--orange-2)}

.ai{border:1px solid rgba(240,125,26,.55);background:linear-gradient(170deg,rgba(240,125,26,.10),var(--card) 60%);border-radius:16px;padding:14px;margin-top:14px}
.ai .h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--orange-2);font-size:14.5px;margin-bottom:10px}
.ai .say{display:flex;gap:8px;font-size:14px;background:var(--blue-soft);color:#cfe4ff;border-radius:12px;padding:10px 12px;margin-top:10px}
.ai .warn{display:flex;gap:8px;font-size:14px;background:var(--red-soft);color:#ffc9c4;border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600}
.spin{width:18px;height:18px;border:2px solid var(--orange-soft);border-top-color:var(--orange);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.mic.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- toast / zoom ---------- */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#111;font-weight:600;padding:12px 18px;border-radius:14px;font-size:14.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:92vw;animation:up .2s ease}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:70;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:92vh;border-radius:10px}

.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:15px}
.empty svg.i{width:36px;height:36px;color:var(--dim);display:block;margin:0 auto 10px}
.home-card{display:flex;gap:14px;align-items:center;cursor:pointer;text-decoration:none;min-height:86px}
.home-card .ic{width:52px;height:52px;border-radius:14px;background:var(--orange-soft);color:var(--orange-2);display:flex;align-items:center;justify-content:center;flex:none}
.home-card .ic svg.i{width:26px;height:26px}
.home-card b{display:block;font-size:16.5px}
.home-card small{color:var(--muted);font-size:13.5px}
.home-card .go{margin-left:auto;color:var(--dim)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;border:1px solid var(--line);background:linear-gradient(135deg,#1c1f24 0%,#14171a 60%),var(--card);margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,125,26,.35),transparent 70%)}
.hero .row{position:relative;z-index:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:6px 11px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details summary{cursor:pointer}

/* ---------- termo (sempre claro, para impressão) ---------- */
.termo{background:#fff;color:#111;max-width:840px;margin:0 auto;padding:30px 34px;border-radius:10px;font-size:13.5px}
.termo .th{display:flex;align-items:center;gap:16px;border-bottom:2px solid #16181b;padding-bottom:12px;margin-bottom:14px}
.termo .th img{height:40px}
.termo h1{font-size:18px;margin:0;color:#111}
.termo .dados{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:10px 0 16px}
.termo table{width:100%;border-collapse:collapse;margin:8px 0}
.termo th,.termo td{border:1px solid #bbb;padding:6px 7px;text-align:left;vertical-align:top}
.termo th{background:#f1efea;font-size:12px}
.termo .fotos img{width:96px;height:72px;object-fit:cover;margin:4px 4px 0 0;border:1px solid #ccc}
.termo ul{margin:4px 0 10px}
.termo .pb{border-top:1px dashed #bbb;margin-top:22px}
.termo .ass{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
.termo .ass div{border-top:1px solid #111;padding-top:6px;text-align:center;font-size:12.5px}
.rel{background:#fff;color:#16181b;max-width:900px;margin:0 auto 20px;padding:26px 30px;border-radius:12px;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rel .th{display:flex;align-items:center;gap:16px;border-bottom:3px solid #f07d1a;padding-bottom:12px;margin-bottom:14px}
.rel .th img{height:42px}
.rel h1{font-size:18px;margin:0;color:#16181b;letter-spacing:-.01em}
.rel .sub{color:#555;font-size:13px;margin-top:2px}
.rel h2{font-size:14px;margin:20px 0 8px;color:#16181b;border-left:4px solid #f07d1a;padding-left:8px}
.rel .small,.rel .sm{font-size:11.5px;color:#555}
.rel .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 10px}
.rel .kpi{border:1px solid #e3e0da;border-radius:10px;padding:10px 8px;text-align:center;background:#faf8f5}
.rel .kpi b{display:block;font-size:22px;color:#f07d1a;line-height:1.1}
.rel .kpi span{display:block;font-size:10.5px;color:#555;margin-top:3px}
.rel table{width:100%;border-collapse:collapse;margin:4px 0}
.rel th,.rel td{border-bottom:1px solid #e3e0da;padding:6px 6px;text-align:left;vertical-align:top}
.rel th{background:#f3f0ea;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#444}
.rel .c{text-align:center}
.rel td.alerta{color:#c0392b;font-weight:600}
.rel table.barras td{border:0;padding:3px 6px}
.rel table.barras .k{width:38%}
.rel table.barras .b span{display:block;height:12px;border-radius:6px;background:#f07d1a}
.rel table.barras .n{width:38px;text-align:right;font-weight:700}
.rel table.barras .p{width:42px;text-align:right;color:#777}
.rel .duas{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rel .vazio{color:#777;font-style:italic;margin:4px 0}
.rel .fotos img{width:90px;height:68px;object-fit:cover;margin:4px 4px 0 0;border:1px solid #ccc;border-radius:4px}
.rel .rodape-rel{margin-top:22px;border-top:1px solid #e3e0da;padding-top:8px;font-size:10.5px;color:#888;text-align:center}
@media screen and (max-width:640px){.rel{padding:16px 14px}.rel .th{flex-wrap:wrap}.rel .th img{height:30px}.rel h1{font-size:16px}.rel .kpis{grid-template-columns:repeat(3,1fr)}.rel .duas{grid-template-columns:1fr}.rel table{font-size:11.5px}.rel table:not(.barras){display:block;overflow-x:auto}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .top,.demo-bar,.rede,.bottom,.nav,.noprint,.toast{display:none!important}
  .rel{padding:0;max-width:none;border-radius:0}
  .rel .kpis{grid-template-columns:repeat(6,1fr)}
  .rel .duas{grid-template-columns:1fr 1fr}
  .rel tr,.rel .kpi{page-break-inside:avoid}
  .rel h2{page-break-after:avoid}
  main{padding:0;max-width:none}
  .termo{border:0;padding:0;max-width:none}
  .termo tr{page-break-inside:avoid}
  .termo .pb{page-break-before:always;border:0;margin:0}
}
</style>
</head>
<body>
<div id="top" class="top"></div>
<div id="rede" class="rede hidden" role="status"></div>
<div id="demoBar" class="demo-bar hidden">Modo demonstração: os dados ficam só neste navegador. Abra o Painel em outra aba para ver o tempo real.</div>
<main id="app"><div class="empty"><span class="spin"></span></div></main>
<div id="bottom"></div>

<script src="config.js"></script>
<script src="base-solucoes.js"></script>
<script src="unidades-demo.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
